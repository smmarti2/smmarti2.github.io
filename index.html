<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth's Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f7f7f7;
        }
        nav {
            background-color: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        main {
            padding: 50px 20px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/journal.html">Journal</a>
        <a href="https://EXTERNAL-URL" target="_blank" rel="noopener noreferrer">
            Course Link
            <span class="visually-hidden">(opens in new tab)</span>
        </a>
    </nav>

    <main>
        <h1>Seth</h1>
        <p>Hello! I’m Seth, a student passionate about artificial intelligence. 
        I’ve taken courses on machine learning, neural networks, and AI in video games. 
        I enjoy exploring how AI can create interactive, intelligent systems.</p>

        <h2>About Me</h2>
        <img src="ANI049-00030 (1).jpg" 
             alt="Young tapir standing on light background" 
             loading="lazy">
    </main>

    <footer>
        <p id="date"></p>
    </footer>

    <script>
        const today = new Date();
        document.getElementById("date").textContent = 
            "Today's date: " + today.toLocaleDateString();
    </script>

</body>
</html>
