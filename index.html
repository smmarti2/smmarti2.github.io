<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth's Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f7f7f7;
        }
        nav {
            background-color: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 50px 20px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Contact</a>
        <a href="#">Course Link</a>
    </nav>

    <main>
        <h1>Seth</h1>
        <p>Hello! I’m Seth, a student passionate about artificial intelligence. 
        I’ve taken courses on machine learning, neural networks, and AI in video games. 
        I enjoy exploring how AI can create interactive, intelligent systems.</p>
    </main>

    <footer>
        <p id="date"></p>
    </footer>

    <script>
        const today = new Date();
        document.getElementById("date").textContent = 
            "Today's date: " + today.toLocaleDateString();
    </script>

</body>
</html>
